/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false    # true only for bench tests: logs ba/grav to Log/pos_log.txt
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: false                # true: publish Map cloud. Keep false in flight: it republishes the whole
                                        # accumulated cloud every second and stalls /Odometry by 0.15-0.37 s
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        mavros:
            # Pose of the LIO body (MID-360 IMU) frame in the vehicle base_link (FLU): v_base = R * v_lio + T.
            # Applied to /mavros/odometry/out only; /Odometry stays in the LIO body frame.
            # R fitted 2026-10-21 from px4log/10_21_lidar_drone_ekf (LIO vs PX4 body rates, 3 flights,
            # residual <= 3.5 deg): yaw 180 deg, pitch -21.8 deg, i.e. the LIO x axis points backwards
            # and 22 deg up. Confirm against the mount before flying.
            extrinsic_T: [ 0.0, 0.0, 0.0 ]   # not measured yet; set this or EKF2_EV_POS_X/Y/Z, not both
            # Must be a rotation: the 4-digit version (|col| = 1.000025) made the EV quaternion
            # non-unit and PX4 rejected it (logs 44/45). The node now orthonormalises it anyway.
            extrinsic_R: [ -0.92848583, 0.0, 0.37136784,
                            0.0,       -1.0, 0.0,
                            0.37136784, 0.0, 0.92848583 ]

        color_mapping:
            input_source: "livox"            # livox | world_cloud
            livox_topic: "/livox/lidar"      # used when input_source=livox
            cloud_topic: "/Laser_map"        # used when input_source=world_cloud
            odom_topic: "/Odometry"       # used for color mapping and time synchronization
            rgb_topic: "/camera/color/image_raw/compressed"
            depth_topic: "/camera/depth/image_raw/compressedDepth"
            camera_info_topic: "/camera/color/camera_info"

            colored_scan_topic: "/cloud_registered_color"
            colored_map_topic: "/laser_map_color"
            world_frame: "world"

            use_camera_info: true
            fx: 0.0
            fy: 0.0
            cx: 0.0
            cy: 0.0

            T_cam_lidar: [ 0.0280838, -0.981278, 0.190538, -0.602142,
                            -0.217406, -0.192047, -0.957002, 0.762459,
                            0.975677, -0.0145479, -0.218729, 0.394083,
                            0.0, 0.0, 0.0, 1.0 ]
            invert_extrinsic: false

            max_image_time_diff: 0.05   # 30hz
            max_depth_time_diff: 0.05   # 30hz
            max_odom_time_diff: 0.2    # 10hz

            use_depth_gate: true
            depth_tolerance: 0.5
            depth_scale: 0.001
            min_depth: 0.1
            max_depth: 80.0

            map_voxel_size: 0.1
            publish_map_every_n: 5
            max_queue_size: 100
            filter_livox_tags: true

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

        imu_propagation:
            enable_high_frequency: false
            publish_frequency: 200  # Hz
            
            # Noise parameters for preintegration
            acc_n: 0.1              # accelerometer noise
            gyr_n: 0.01             # gyroscope noise  
            acc_w: 0.0001           # accelerometer bias random walk
            gyr_w: 0.00001          # gyroscope bias random walk
